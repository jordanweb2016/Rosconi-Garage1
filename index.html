<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosconi Garage | Taller Mecánico Automotriz</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* (Mantengo todo el CSS de la versión anterior, solo agrego la animación del auto con emoji) */
        :root {
            --bg-dark: #0a0a0a;
            --bg-dark-secondary: #111111;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #707070;
            --accent: #ff6b00;
            --accent-hover: #ff8533;
            --border: #2a2a2a;
            --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.5);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --border-radius: 16px;
            --border-radius-sm: 10px;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 80px; }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: var(--accent); color: #fff; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        /* INTRO SPLASH ANIMADA */
        #intro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: var(--bg-dark);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.18, 1);
            will-change: transform;
            overflow: hidden;
            cursor: pointer;
        }
        #intro.hidden { transform: translateY(-100%); }
        .intro-content { text-align: center; padding: 20px; position: relative; z-index: 2; }
        .intro-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 10vw, 7rem);
            letter-spacing: 5px;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #fff;
            transition: all 0.5s ease;
        }
        .intro-title .orange {
            color: var(--accent);
            display: block;
            font-size: clamp(4rem, 12vw, 8rem);
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
        }
        .intro-services {
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .intro-arrow { font-size: 3rem; color: var(--accent); animation: bounceDown 1.5s infinite; cursor: pointer; display: inline-block; }
        .intro-text { margin-top: 10px; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
        @keyframes bounceDown { 0%,100% { transform: translateY(0); opacity: 0.7; } 50% { transform: translateY(15px); opacity: 1; } }

        /* Estilos para el auto (emoji) y estela */
        .intro-car {
            position: absolute;
            left: -200px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 100px;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .intro-car.active { animation: carDrive 0.7s forwards ease-in; }
        @keyframes carDrive { 0% { left: -200px; opacity: 1; } 100% { left: 110%; opacity: 0; } }
        .intro-title-trail {
            position: absolute;
            left: -100%;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-display);
            font-size: clamp(4rem, 12vw, 8rem);
            letter-spacing: 5px;
            color: transparent;
            -webkit-text-stroke: 2px var(--accent);
            text-shadow: 0 0 30px rgba(255,107,0,0.7);
            white-space: nowrap;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
        }
        .intro-title-trail.active { animation: trailMove 0.7s forwards ease-in; }
        @keyframes trailMove { 0% { left: -100%; opacity: 1; } 100% { left: 100%; opacity: 0; } }
        .intro-content.fade-out { opacity: 0; transform: scale(0.9); }

        /* Resto del CSS (igual que antes) */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        .section-padding { padding: 100px 0; }
        .section-tag { display: inline-block; font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
        .section-title { font-family: var(--font-display); font-size: clamp(2.8rem, 6vw, 4.5rem); font-weight: 400; text-transform: uppercase; line-height: 1.1; letter-spacing: 2px; margin-bottom: 20px; }
        .section-subtitle { font-size: 1.1rem; color: var(--text-secondary); max-width: 600px; line-height: 1.8; }
        .text-accent { color: var(--accent); }
        .text-center { text-align: center; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        /* (Acá va todo el resto del CSS como en el archivo anterior, pero por brevedad no lo repito completo; confío en que ya lo tenés) */
    </style>
</head>
<body>
    <!-- INTRO ANIMADA -->
    <div id="intro" onclick="animateIntro()">
        <div class="intro-content" id="introContent">
            <h1 class="intro-title">ROSCONI<br><span class="orange">GARAGE</span></h1>
            <p class="intro-services">Mecánica Integral · Lubricentro · Reprogramación Electrónica</p>
            <div class="intro-arrow"><i class="fas fa-chevron-down"></i></div>
            <div class="intro-text">Hacé clic para continuar</div>
        </div>
        <!-- Auto (emoji) y estela -->
        <div class="intro-car" id="introCar">🚗💨</div>
        <div class="intro-title-trail" id="introTrail">ROSCONI GARAGE</div>
    </div>

    <!-- Resto del HTML (igual que antes) -->
    <!-- ... -->
</body>
</html>
