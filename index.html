<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosconi Garage | Taller Mecánico Automotriz</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* (Se mantiene todo el CSS de la página, solo se modifica la parte de intro) */
        :root {
            --bg-dark: #0a0a0a;
            --bg-dark-secondary: #111111;
            --bg-card: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #707070;
            --accent: #ff6b00;
            --accent-hover: #ff8533;
            --border: #2a2a2a;
            --shadow-card: 0 10px 40px rgba(0, 0, 0, 0.5);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --border-radius: 16px;
            --border-radius-sm: 10px;
            --font-display: 'Bebas Neue', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 80px; }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        /* (resto del CSS general igual) */

        /* INTRO MEJORADA */
        #intro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background: var(--bg-dark);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.18, 1);
            overflow: hidden;
            cursor: pointer;
        }
        #intro.hidden { transform: translateY(-100%); }
        .intro-content {
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 5;
        }
        .intro-content.fade-out { opacity: 0; transform: scale(0.9); }
        .intro-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 10vw, 7rem);
            letter-spacing: 5px;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #fff;
        }
        .intro-title .orange {
            color: var(--accent);
            display: block;
            font-size: clamp(4rem, 12vw, 8rem);
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.5);
        }
        .intro-services {
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        .intro-arrow { font-size: 3rem; color: var(--accent); animation: bounceDown 1.5s infinite; }
        .intro-text { margin-top: 10px; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
        @keyframes bounceDown { 0%,100% { transform: translateY(0); opacity: 0.7; } 50% { transform: translateY(15px); opacity: 1; } }

        /* Auto y estela */
        .intro-car {
            position: absolute;
            left: -200px;
            top: 50%;
            transform: translateY(-50%);
            width: 150px; /* Ajustá según el tamaño de tu PNG */
            height: auto;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            filter: drop-shadow(0 0 30px rgba(255,107,0,0.7));
        }
        .intro-car.active { animation: carDrive 1s forwards ease-in; }
        @keyframes carDrive {
            0% { left: -200px; opacity: 1; }
            100% { left: 110%; opacity: 1; }
        }
        .intro-trail {
            position: absolute;
            left: -100%;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-display);
            font-size: clamp(4rem, 12vw, 8rem);
            letter-spacing: 5px;
            background: linear-gradient(90deg, #ff6b00, #ffb347, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 25px rgba(255,107,0,0.8));
            white-space: nowrap;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
        }
        .intro-trail.active { animation: trailMove 1s forwards ease-in; }
        @keyframes trailMove {
            0% { left: -100%; opacity: 1; }
            100% { left: 100%; opacity: 0.2; }
        }
        .intro-click-text {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 10px 30px;
            border-radius: 50px;
            border: 2px solid var(--accent);
            opacity: 0;
            z-index: 4;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .intro-click-text.show { opacity: 1; }

        /* Responsive para el auto */
        @media (max-width: 768px) {
            .intro-car { width: 100px; }
            .intro-trail { font-size: 3rem; }
            .intro-click-text { font-size: 1.2rem; padding: 8px 20px; }
        }
    </style>
</head>
<body>
    <!-- INTRO ANIMADA -->
    <div id="intro" onclick="animateIntro()">
        <div class="intro-content" id="introContent">
            <h1 class="intro-title">ROSCONI<br><span class="orange">GARAGE</span></h1>
            <p class="intro-services">Mecánica Integral · Lubricentro · Reprogramación Electrónica</p>
            <div class="intro-arrow"><i class="fas fa-chevron-down"></i></div>
            <div class="intro-text">Hacé click para continuar</div>
        </div>
        <!-- Auto PNG -->
        <img id="introCar" class="intro-car" src="https://i.imgur.com/wU76ckj.png" alt="Auto Rosconi Garage">
        <div class="intro-trail" id="introTrail">ROSCONI GARAGE</div>
        <div class="intro-click-text" id="introClickText">Hacé click para continuar</div>
    </div>

    <!-- (NAVBAR, HERO, etc., se mantienen igual que en el código anterior) -->
    <!-- ... -->

    <script>
        // INTRO ANIMADA
        const intro = document.getElementById('intro');
        const introContent = document.getElementById('introContent');
        const introCar = document.getElementById('introCar');
        const introTrail = document.getElementById('introTrail');
        const introClickText = document.getElementById('introClickText');
        let introHidden = false;

        function animateIntro() {
            if (introHidden) return;
            introHidden = true;

            // Ocultar contenido original
            introContent.classList.add('fade-out');

            // Mostrar auto y estela
            introCar.classList.add('active');
            introTrail.classList.add('active');

            // Mostrar texto "Hacé click para continuar" después de la animación
            setTimeout(() => {
                introClickText.classList.add('show');
            }, 1000);

            // Ocultar intro al hacer clic nuevamente
            introClickText.addEventListener('click', () => {
                intro.classList.add('hidden');
                document.body.style.overflow = '';
            });

            // Alternativa: ocultar después de 2 segundos
            setTimeout(() => {
                intro.classList.add('hidden');
                document.body.style.overflow = '';
            }, 2500);
        }

        // Disparar con clic, scroll, teclado
        intro.addEventListener('click', animateIntro);
        window.addEventListener('wheel', () => { if (!introHidden) animateIntro(); }, { passive: true });
        window.addEventListener('touchmove', () => { if (!introHidden) animateIntro(); }, { passive: true });
        window.addEventListener('keydown', (e) => {
            if ((e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') && !introHidden) animateIntro();
        });

        // Bloquear scroll al cargar
        document.body.style.overflow = 'hidden';
        window.addEventListener('load', () => {
            intro.classList.remove('hidden');
            introHidden = false;
            document.body.style.overflow = 'hidden';
        });

        // (Resto del código igual: carrusel, navbar, etc.)
    </script>
</body>
</html>
